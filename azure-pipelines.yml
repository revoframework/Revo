# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- master
- develop

pool:
  vmImage: 'ubuntu-22.04'

variables:
- group: ci-nuget-vars
  
steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '10.0.x'
- task: DotNetCoreCLI@2
  inputs:
    command: 'custom'
    custom: 'tool'
    arguments: 'update -g Cake.Tool --version 0.38.5'
- task: Bash@3
  inputs:
    targetType: 'inline'
    script: 'dotnet-cake --Target="CI" --Configuration="Release" --ReleaseNuGetApiKey="$(NUGET_ORG_API_KEY)" --PreReleaseNuGetApiKey="$(GITHUB_API_KEY)"'
- task: NuGetAuthenticate@1
- task: DotNetCoreCLI@2
  inputs:
    command: 'custom'
    custom: 'nuget'
    arguments: 'push "./build/packages/*.nupkg" --source "https://pkgs.dev.azure.com/revoframework/7ff8258b-dd3c-4007-9d06-7609742e93cf/_packaging/f4e837d9-074e-4374-afa0-7366d34fe578/nuget/v3/index.json" --api-key AzureArtifacts --skip-duplicate'